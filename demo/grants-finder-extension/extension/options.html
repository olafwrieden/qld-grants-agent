<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Grants Finder AI Companion - settings</title>
  <style>
    body { font: 15px/1.5 'Segoe UI', system-ui, sans-serif; color: #1b2533; max-width: 560px; margin: 40px auto; padding: 0 20px; }
    h1 { font-size: 20px; margin: 0 0 4px; }
    p { color: #5b6878; }
    label { display: block; font-weight: 600; margin: 20px 0 6px; }
    input { width: 100%; padding: 10px 12px; font: inherit; border: 1px solid #cfd7e2; border-radius: 10px; }
    .row { display: flex; gap: 8px; margin-top: 14px; }
    button { padding: 9px 16px; font: inherit; font-weight: 600; border-radius: 10px; border: 1px solid #cfd7e2; background: #fff; cursor: pointer; }
    button.primary { background: #09549f; color: #fff; border-color: transparent; }
    #status { margin-top: 14px; font-size: 14px; }
    code { background: #eef2f7; padding: 1px 5px; border-radius: 5px; }
  </style>
</head>
<body>
  <h1>Grants Finder AI Companion</h1>
  <p>The extension talks to your Foundry agent through the local agent bridge. Start it with <code>npm run bridge</code> in <code>demo/grants-finder-extension</code>.</p>
  <label for="bridge">Agent bridge URL</label>
  <input id="bridge" type="url" placeholder="http://127.0.0.1:8787">
  <div class="row">
    <button class="primary" id="save">Save</button>
    <button id="test">Test connection</button>
    <button id="clear">Clear conversation</button>
  </div>
  <div id="status" role="status"></div>
  <script src="options.js"></script>
</body>
</html>
